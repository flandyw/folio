org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Match the Kotlin analysis API used by Compose dependency lint checks.
# https://developer.android.com/develop/ui/compose/tooling/lint
android.experimental.lint.version=8.8.2
# Build-speed flags: cache + parallel modules + configuration cache + incremental Kotlin.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
# Smaller R classes + non-final IDs: faster incremental builds, smaller dex.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
