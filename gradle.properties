org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Lint uses the version bundled with AGP 8.7.3 (no experimental override, so no
# "experimental option" configuration warning). See
# https://developer.android.com/develop/ui/compose/tooling/lint
# Build-speed flags: cache + parallel modules + configuration cache + incremental Kotlin.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
# Smaller R classes + non-final IDs: faster incremental builds, smaller dex.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# AGP 8.7.3 was tested up to compileSdk 35; Folio compiles against 36 (targetSdk stays 35).
# Suppress the officially-documented warning: https://d.android.com/r/tools/api-level-support
android.suppressUnsupportedCompileSdk=36
