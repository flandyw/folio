org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Lint uses the version bundled with AGP (no experimental override, so no
# "experimental option" configuration warning). See
# https://developer.android.com/develop/ui/compose/tooling/lint
# Build-speed flags: build cache + parallel + configuration cache (R classes and Kotlin incrementality are AGP/KGP defaults).
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.parallel.tasks.in.project=true
# Folio compiles against SDK 36 (targetSdk stays 35); AGP 9.4 supports up to API 37,
# so no suppressUnsupportedCompileSdk override is needed.
