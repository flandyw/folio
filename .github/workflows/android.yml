name: Android checks

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check no hardcoded Supabase secrets
        run: |
          set -euo pipefail
          if grep -R --exclude-dir=build --exclude-dir=.gradle --exclude-dir=.git -E "sb_publishable_[A-Za-z0-9_.-]{10,}" app/build.gradle.kts docs/ README.md .github/ 2>/dev/null | grep -v "sb_publishable_example_placeholder_for_local_ci_builds_only" | grep -v "your-publishable" | grep -q .; then
            echo "Hardcoded Supabase publishable key found; use the ExamTrack or Focal secret instead"
            exit 1
          fi
          if grep -R --exclude-dir=build --exclude-dir=.gradle --exclude-dir=.git -E "[a-z0-9-]+\.supabase\.co" app/build.gradle.kts docs/ README.md .github/ 2>/dev/null | grep -v "example\.supabase\.co" | grep -v "your-project\.supabase\.co" | grep -q .; then
            echo "Hardcoded Supabase URL found; use the ExamTrack or Focal secret instead"
            exit 1
          fi
      - name: Check bundled offline KaTeX
        run: node tools/katex-smoke.cjs
      - name: Experimental build numbering and publish prompt
        run: python3 tools/build-version-smoke.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Android build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:prepareBackupSmoke
      - name: R8 minify check
        run: ./gradlew :app:minifyReleaseWithR8 -PfolioMinify=true
      - name: Backup format regression checks
        run: node tools/backup-smoke.cjs
      - name: Stable and experimental update checks
        run: node tools/update-smoke.cjs
      - name: Writing follow regression traces
        run: node tools/writing-follow-smoke.cjs
