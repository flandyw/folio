name: Android releases
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" || { echo 'Release history must not be rewritten'; exit 1; }
            commits=$(git rev-list --reverse --first-parent "$BEFORE..$GITHUB_SHA" | jq -R . | jq -sc .)
          else
            commits=$(jq -nc --arg sha "$GITHUB_SHA" '[$sha]')
          fi
          echo "commits=$commits" >> "$GITHUB_OUTPUT"

  release:
    needs: commits
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        commit: ${{ fromJSON(needs.commits.outputs.commits) }}
    concurrency:
      group: release-${{ matrix.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - name: Skip an already published commit
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          tag="v$((count / 100)).$(((count / 10) % 10)).$((count % 10))"
          if git show-ref --verify --quiet "refs/tags/$tag" && gh release view "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
            echo "Release $tag already exists"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          # Override the default list, which includes the unavailable legacy 'tools' package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        if: steps.existing.outputs.skip != 'true'
      - name: Calculate version
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ./gradlew -q :app:printReleaseVersion >> "$GITHUB_ENV"
      - name: Build signed release
        if: steps.existing.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/folio-release.p12
          FOCAL_SUPABASE_URL: ${{ secrets.FOCAL_SUPABASE_URL }}
          FOCAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FOCAL_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing signing keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing signing password secret}"
          : "${FOCAL_SUPABASE_URL:?Missing Focal Supabase URL secret}"
          : "${FOCAL_SUPABASE_PUBLISHABLE_KEY:?Missing Focal Supabase publishable key secret}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bash ./gradlew :app:assembleRelease -PfolioMinify=true
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/folio-$VERSION_NAME.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "dist/folio-$VERSION_NAME.apk"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          apk = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          entry = apk['elements'][0]
          assert apk['applicationId'] == 'com.folio.notes'
          assert entry['versionCode'] == int(os.environ['VERSION_CODE'])
          assert entry['versionName'] == os.environ['VERSION_NAME']
          metadata = {
              'schema_version': 1,
              'version_code': entry['versionCode'],
              'version_name': entry['versionName'],
              'tag_name': os.environ['RELEASE_TAG'],
          }
          Path('dist/update.json').write_text(json.dumps(metadata) + '\n')
          PY
          (cd dist && sha256sum "folio-$VERSION_NAME.apk" update.json > SHA256SUMS)
      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$COMMIT"
            echo "Release $tag already exists"
          else
            gh release create "$tag" dist/* --target "$COMMIT" \
              --title "Folio $VERSION_NAME" --generate-notes
          fi
